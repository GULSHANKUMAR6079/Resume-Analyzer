services:
  - type: web
    name: ats-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_md"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: SPACY_MODEL_PRIMARY
        value: en_core_web_md
      - key: SPACY_MODEL_SECONDARY
        value: en_core_web_sm
      - key: SENTENCE_TRANSFORMER_MODEL
        value: all-MiniLM-L6-v2
